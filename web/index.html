<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Premium local movie library viewer with VLC integration">
    <title>Movie Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0f;
            --bg-gradient: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #0a0a0f 100%);
            --card-bg: rgba(30, 30, 46, 0.8);
            --card-bg-hover: rgba(40, 40, 60, 0.95);
            --text-primary: #f0f0f5;
            --text-secondary: #a0a0b0;
            --accent: #bb86fc;
            --accent-hover: #d4a5ff;
            --accent-glow: rgba(187, 134, 252, 0.3);
            --border: rgba(187, 134, 252, 0.15);
            --success: #4caf50;
            --info: #2196f3;
            --warning: #ffc107;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 100%;
            padding: 20px 40px;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 20px 30px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            margin: 0;
            font-size: 1.8em;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent) 0%, #ff79c6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stats {
            color: var(--text-secondary);
            font-size: 0.9em;
            margin-top: 5px;
        }

        .header-right {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            padding: 0 10px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 12px 18px;
            border-radius: 12px;
            flex-grow: 1;
            min-width: 250px;
            font-size: 0.95em;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        input[type="text"]::placeholder {
            color: var(--text-secondary);
        }

        button {
            background: linear-gradient(135deg, var(--accent) 0%, #9965f4 100%);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
            font-size: 0.9em;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--accent-glow);
            white-space: nowrap;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px var(--accent-glow);
        }

        /* Filter Tags Section */
        .filter-section {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 15px 20px;
            margin-bottom: 20px;
        }

        .filter-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .filter-row:last-child {
            margin-bottom: 0;
        }

        .filter-label {
            font-size: 0.8em;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            min-width: 70px;
        }

        .filter-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-tag {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8em;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: none;
        }

        .filter-tag:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            transform: none;
        }

        .filter-tag.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .toggle-btn {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: none;
            padding: 8px 16px;
        }

        .toggle-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-primary);
            transform: none;
        }

        .toggle-btn.active {
            background: var(--accent);
            color: #000;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            padding: 0 10px;
        }

        .movie-grid.no-posters {
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        }

        .movie-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .movie-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 30px var(--accent-glow);
            background: var(--card-bg-hover);
            border-color: var(--accent);
        }

        .poster-container {
            height: 200px;
            width: 100%;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #2c2c3c 0%, #1f1f2f 100%);
        }

        .poster-container.hidden {
            display: none;
        }

        .poster-placeholder {
            height: 100%;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 3.5em;
            background: linear-gradient(135deg, rgba(187, 134, 252, 0.1) 0%, rgba(255, 121, 198, 0.1) 100%);
        }

        .poster-img {
            height: 100%;
            width: 100%;
            object-fit: contain;
            background-color: #0a0a0f;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .poster-img.loaded {
            opacity: 1;
        }

        .card-content {
            padding: 18px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .movie-title {
            font-size: 1.1em;
            font-weight: 600;
            margin: 0 0 8px 0;
            line-height: 1.4;
            color: var(--text-primary);
        }

        .movie-meta {
            color: var(--text-secondary);
            font-size: 0.9em;
            margin-bottom: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag {
            background: rgba(255, 255, 255, 0.08);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .tag.hd {
            color: var(--success);
            background: rgba(76, 175, 80, 0.15);
        }

        .tag.year {
            color: var(--info);
            background: rgba(33, 150, 243, 0.15);
        }

        .tag.rating {
            color: var(--warning);
            background: rgba(255, 193, 7, 0.15);
        }

        .tag.genre {
            color: #ff79c6;
            background: rgba(255, 121, 198, 0.15);
        }

        .file-name {
            font-size: 0.75em;
            color: var(--text-secondary);
            margin-top: auto;
            word-break: break-all;
            margin-bottom: 15px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            line-height: 1.4;
        }

        .card-actions {
            display: flex;
            gap: 8px;
        }

        .play-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            color: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 0.9em;
            box-shadow: none;
        }

        .play-btn:hover {
            background: var(--accent);
            color: #000;
            transform: none;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .info-btn {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.9em;
            box-shadow: none;
        }

        .info-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border-color: var(--text-secondary);
            transform: none;
        }

        .search-btn {
            background: rgba(255, 193, 7, 0.1);
            color: var(--warning);
            border: 1px solid rgba(255, 193, 7, 0.3);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.9em;
            box-shadow: none;
            min-width: auto;
        }

        .search-btn:hover {
            background: rgba(255, 193, 7, 0.25);
            color: var(--warning);
            border-color: var(--warning);
            transform: none;
        }

        /* Search Modal Styles */
        .search-modal-body {
            padding: 24px;
        }

        .search-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .search-input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .search-input-group label {
            font-size: 0.8em;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .search-input-group input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
        }

        .search-input-group input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .search-hint {
            font-size: 0.8em;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .search-result {
            margin-top: 16px;
            padding: 16px;
            border-radius: 10px;
            text-align: center;
        }

        .search-result.success {
            background: rgba(76, 175, 80, 0.15);
            border: 1px solid rgba(76, 175, 80, 0.3);
            color: var(--success);
        }

        .search-result.error {
            background: rgba(255, 87, 87, 0.15);
            border: 1px solid rgba(255, 87, 87, 0.3);
            color: #ff5757;
        }

        .search-submit {
            margin-top: 8px;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: var(--text-secondary);
            font-size: 1.1em;
        }

        /* Info Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1a 100%);
            border-radius: 20px;
            border: 1px solid var(--border);
            width: 90%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.9) translateY(20px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 40px var(--accent-glow);
        }

        .modal-overlay.active .modal {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 24px 24px 0 24px;
            position: sticky;
            top: 0;
            background: linear-gradient(180deg, #1a1a2e 0%, transparent 100%);
            z-index: 1;
        }

        .modal-title {
            font-size: 1.6em;
            font-weight: 700;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, var(--accent) 0%, #ff79c6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .modal-close {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-secondary);
            font-size: 1.5em;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            box-shadow: none;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.2);
            color: var(--text-primary);
            transform: none;
        }

        .modal-body {
            padding: 20px 24px 24px 24px;
        }

        .modal-poster {
            width: 100%;
            max-width: 250px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-label {
            font-size: 0.75em;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .info-value {
            font-size: 0.95em;
            color: var(--text-primary);
            line-height: 1.5;
        }

        .plot-section {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 16px;
        }

        .plot-section .info-label {
            margin-bottom: 10px;
        }

        .plot-section .info-value {
            line-height: 1.7;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(187, 134, 252, 0.3);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(187, 134, 252, 0.5);
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .movie-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 15px;
            }

            .poster-container {
                height: 150px;
            }

            .card-content {
                padding: 12px;
            }

            .modal {
                width: 95%;
                margin: 10px;
            }

            .filter-section {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <div>
                <h1>🎬 Movie Library</h1>
                <div class="stats" id="stats">Loading library...</div>
            </div>
            <div class="header-right">
                <button class="toggle-btn" id="posterToggle" onclick="togglePosters()">🖼️ Posters</button>
                <button onclick="loadMovies()">↻ Refresh</button>
            </div>
        </header>

        <div class="controls">
            <input type="text" id="searchInput" placeholder="🔍 Search movies by title, year, genre, actors..."
                onkeyup="filterMovies()">
        </div>

        <!-- Filter Section -->
        <div class="filter-section" id="filterSection">
            <div class="filter-row">
                <span class="filter-label">Genres:</span>
                <div class="filter-tags" id="genreTags">
                    <!-- Populated dynamically -->
                </div>
            </div>
            <div class="filter-row">
                <span class="filter-label">Years:</span>
                <div class="filter-tags" id="yearTags">
                    <!-- Populated dynamically -->
                </div>
            </div>
            <div class="filter-row">
                <span class="filter-label">Languages:</span>
                <div class="filter-tags" id="langTags">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </div>

        <div id="movieContainer" class="movie-grid">
            <div class="loading">✨ Loading your movie collection...</div>
        </div>
    </div>

    <!-- Info Modal -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div>
                    <h2 class="modal-title" id="modalTitle">Movie Title</h2>
                </div>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Content will be dynamically inserted -->
            </div>
        </div>
    </div>

    <!-- Search Modal -->
    <div class="modal-overlay" id="searchModalOverlay" onclick="closeSearchModal(event)">
        <div class="modal" onclick="event.stopPropagation()" style="max-width: 500px;">
            <div class="modal-header">
                <div>
                    <h2 class="modal-title" id="searchModalTitle">🔍 Manual OMDb Search</h2>
                </div>
                <button class="modal-close" onclick="closeSearchModal()">&times;</button>
            </div>
            <div class="search-modal-body">
                <div class="search-hint">
                    Enter movie details to search OMDb. Use IMDb ID (e.g., tt0133093) for best results,
                    or enter title and year.
                </div>
                <div class="search-form">
                    <input type="hidden" id="searchMovieUuid">
                    <div class="search-input-group">
                        <label>IMDb ID (Preferred)</label>
                        <input type="text" id="searchImdbId" placeholder="e.g., tt0133093">
                    </div>
                    <div class="search-input-group">
                        <label>Movie Title</label>
                        <input type="text" id="searchTitle" placeholder="e.g., The Matrix">
                    </div>
                    <div class="search-input-group">
                        <label>Year (Optional)</label>
                        <input type="text" id="searchYear" placeholder="e.g., 1999">
                    </div>
                    <button class="search-submit" onclick="submitManualSearch()">🔍 Search & Update</button>
                </div>
                <div id="searchResult"></div>
            </div>
        </div>
    </div>

    <script>
        let allMovies = [];
        let showPosters = true;
        let activeFilters = { genre: null, year: null, language: null };

        async function loadMovies() {
            const container = document.getElementById('movieContainer');
            container.innerHTML = '<div class="loading">✨ Loading your movie collection...</div>';

            try {
                const response = await fetch('/api/movies');
                allMovies = await response.json();

                updateStats();
                populateFilters();
                renderMovies(allMovies);
            } catch (error) {
                console.error('Error loading movies:', error);
                container.innerHTML = '<div class="loading">❌ Error loading movies. Is the server running?</div>';
            }
        }

        function updateStats() {
            const count = allMovies.length;
            const enriched = allMovies.filter(m => m.imdb_id && m.imdb_id !== 'NA').length;
            const complete = allMovies.filter(m => m.is_active == 2).length;
            document.getElementById('stats').textContent = `${count} movies • ${enriched} with IMDb • ${complete} fully enriched`;
        }

        function populateFilters() {
            // Extract unique genres
            const genres = new Set();
            const years = new Set();
            const languages = new Set();

            allMovies.forEach(m => {
                if (m.genre && m.genre !== 'NA') {
                    m.genre.split(',').forEach(g => genres.add(g.trim()));
                }
                const year = m.year !== 'NA' ? m.year : m.extracted_year;
                if (year && year !== 'NA') {
                    const decade = Math.floor(parseInt(year) / 10) * 10;
                    if (decade >= 1950 && decade <= 2020) {
                        years.add(decade + 's');
                    }
                }
                if (m.language && m.language !== 'NA') {
                    m.language.split(',').forEach(l => languages.add(l.trim()));
                }
            });

            // Populate genre tags (top 12)
            const genreContainer = document.getElementById('genreTags');
            const topGenres = [...genres].slice(0, 12);
            genreContainer.innerHTML = topGenres.map(g =>
                `<button class="filter-tag" onclick="toggleFilter('genre', '${g}')">${g}</button>`
            ).join('');

            // Populate year tags
            const yearContainer = document.getElementById('yearTags');
            const sortedYears = [...years].sort().reverse();
            yearContainer.innerHTML = sortedYears.map(y =>
                `<button class="filter-tag" onclick="toggleFilter('year', '${y}')">${y}</button>`
            ).join('');

            // Populate language tags (top 8)
            const langContainer = document.getElementById('langTags');
            const topLangs = [...languages].slice(0, 8);
            langContainer.innerHTML = topLangs.map(l =>
                `<button class="filter-tag" onclick="toggleFilter('language', '${l}')">${l}</button>`
            ).join('');
        }

        function toggleFilter(type, value) {
            if (activeFilters[type] === value) {
                activeFilters[type] = null;
            } else {
                activeFilters[type] = value;
            }

            // Update button states
            document.querySelectorAll(`.filter-tag`).forEach(btn => {
                btn.classList.remove('active');
            });
            Object.entries(activeFilters).forEach(([key, val]) => {
                if (val) {
                    document.querySelectorAll(`.filter-tag`).forEach(btn => {
                        if (btn.textContent === val) btn.classList.add('active');
                    });
                }
            });

            filterMovies();
        }

        function togglePosters() {
            showPosters = !showPosters;
            const btn = document.getElementById('posterToggle');
            const container = document.getElementById('movieContainer');

            if (showPosters) {
                btn.classList.remove('active');
                container.classList.remove('no-posters');
            } else {
                btn.classList.add('active');
                container.classList.add('no-posters');
            }

            // Re-render
            filterMovies();
        }

        function renderMovies(movies) {
            const container = document.getElementById('movieContainer');
            container.innerHTML = '';

            if (movies.length === 0) {
                container.innerHTML = '<div class="loading">🔍 No movies found matching your filters.</div>';
                return;
            }

            // Sort: Enriched first, then by year desc
            movies.sort((a, b) => {
                if (a.ai_title !== 'NA' && b.ai_title === 'NA') return -1;
                if (a.ai_title === 'NA' && b.ai_title !== 'NA') return 1;
                return (b.year || 0) - (a.year || 0);
            });

            // Limit rendering for performance (first 100)
            const displayMovies = movies.slice(0, 100);

            displayMovies.forEach(movie => {
                const title = movie.title !== 'NA' ? movie.title : (movie.ai_title !== 'NA' ? movie.ai_title : movie.extracted_name);
                const year = movie.year !== 'NA' ? movie.year : movie.extracted_year;
                const poster = movie.poster && movie.poster !== 'NA' ? movie.poster : null;
                const rating = movie.imdb_rating && movie.imdb_rating !== 'NA' ? movie.imdb_rating : null;
                const genre = movie.genre && movie.genre !== 'NA' ? movie.genre.split(',')[0].trim() : null;

                const card = document.createElement('div');
                card.className = 'movie-card';

                // Poster with lazy loading
                let posterHtml = '';
                if (showPosters) {
                    if (poster) {
                        posterHtml = `
                            <div class="poster-container">
                                <img data-src="${poster}" class="poster-img" alt="${escapeHtml(title)}" 
                                     onclick="loadPosterImage(this)"
                                     onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                                <div class="poster-placeholder" style="display:none">🎬</div>
                                <div class="poster-placeholder" onclick="loadPosterImage(this.previousElementSibling.previousElementSibling)" 
                                     style="cursor:pointer;font-size:1.5em;" title="Click to load poster">🖼️ Click to load</div>
                            </div>`;
                    } else {
                        posterHtml = `
                            <div class="poster-container">
                                <div class="poster-placeholder">🎬</div>
                            </div>`;
                    }
                }

                const hasOmdbData = movie.title !== 'NA' || movie.plot !== 'NA';

                card.innerHTML = `
                    ${posterHtml}
                    <div class="card-content">
                        <div class="movie-title">${escapeHtml(title || 'Unknown Title')}</div>
                        <div class="movie-meta">
                            ${year && year !== 'NA' ? `<span class="tag year">${year}</span>` : ''}
                            ${rating ? `<span class="tag rating">⭐ ${rating}</span>` : ''}
                            ${genre ? `<span class="tag genre">${genre}</span>` : ''}
                            ${movie.imdb_id && movie.imdb_id !== 'NA' ? '<span class="tag hd">IMDb</span>' : ''}
                        </div>
                        <div class="file-name" title="${escapeHtml(movie.file_name)}">${escapeHtml(movie.file_name)}</div>
                        <div class="card-actions">
                            <button class="play-btn" onclick="playMovie('${movie.uuid}')">▶ Play</button>
                            <button class="search-btn" onclick="openSearchModal('${movie.uuid}', '${escapeHtml(movie.extracted_name || '')}', '${movie.extracted_year || ''}')">🔍</button>
                            ${hasOmdbData ? `<button class="info-btn" onclick='showInfo(${JSON.stringify(movie).replace(/'/g, "&#39;")})'>ℹ</button>` : ''}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            if (movies.length > 100) {
                const more = document.createElement('div');
                more.className = 'loading';
                more.textContent = `📚 And ${movies.length - 100} more... (refine your search)`;
                container.appendChild(more);
            }
        }

        function loadPosterImage(img) {
            if (img.tagName !== 'IMG') return;
            const src = img.getAttribute('data-src');
            if (src && !img.src) {
                img.src = src;
                img.onload = () => {
                    img.classList.add('loaded');
                    // Hide the "click to load" placeholder
                    if (img.nextElementSibling && img.nextElementSibling.nextElementSibling) {
                        img.nextElementSibling.nextElementSibling.style.display = 'none';
                    }
                };
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function filterMovies() {
            const query = document.getElementById('searchInput').value.toLowerCase();

            let filtered = allMovies.filter(movie => {
                // Text search
                const title = (movie.title || '').toLowerCase();
                const aiTitle = (movie.ai_title || '').toLowerCase();
                const file = (movie.file_name || '').toLowerCase();
                const extracted = (movie.extracted_name || '').toLowerCase();
                const genre = (movie.genre || '').toLowerCase();
                const actors = (movie.actors || '').toLowerCase();

                const matchesQuery = !query ||
                    title.includes(query) ||
                    aiTitle.includes(query) ||
                    file.includes(query) ||
                    extracted.includes(query) ||
                    genre.includes(query) ||
                    actors.includes(query);

                // Filter by genre
                const matchesGenre = !activeFilters.genre ||
                    (movie.genre && movie.genre.includes(activeFilters.genre));

                // Filter by year/decade
                let matchesYear = !activeFilters.year;
                if (activeFilters.year) {
                    const decade = parseInt(activeFilters.year);
                    const movieYear = parseInt(movie.year !== 'NA' ? movie.year : movie.extracted_year);
                    matchesYear = movieYear >= decade && movieYear < decade + 10;
                }

                // Filter by language
                const matchesLang = !activeFilters.language ||
                    (movie.language && movie.language.includes(activeFilters.language));

                return matchesQuery && matchesGenre && matchesYear && matchesLang;
            });

            renderMovies(filtered);
        }

        function showInfo(movie) {
            const modal = document.getElementById('modalOverlay');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');

            const displayTitle = movie.title !== 'NA' ? movie.title : (movie.ai_title !== 'NA' ? movie.ai_title : movie.extracted_name);
            title.textContent = displayTitle || 'Movie Details';

            const posterHtml = movie.poster && movie.poster !== 'NA'
                ? `<img src="${movie.poster}" class="modal-poster" alt="${escapeHtml(displayTitle)}">`
                : '';

            const infoItems = [
                { label: 'Year', value: movie.year },
                { label: 'Runtime', value: movie.runtime },
                { label: 'Genre', value: movie.genre },
                { label: 'Director', value: movie.director },
                { label: 'Actors', value: movie.actors },
                { label: 'Language', value: movie.language },
                { label: 'Country', value: movie.country },
                { label: 'IMDb Rating', value: movie.imdb_rating !== 'NA' ? `⭐ ${movie.imdb_rating}` : 'NA' },
                { label: 'IMDb ID', value: movie.imdb_id },
                { label: 'Box Office', value: movie.box_office },
                { label: 'Awards', value: movie.awards },
            ].filter(item => item.value && item.value !== 'NA');

            const plotHtml = movie.plot && movie.plot !== 'NA'
                ? `<div class="plot-section">
                        <div class="info-label">Plot</div>
                        <div class="info-value">${escapeHtml(movie.plot)}</div>
                   </div>`
                : '';

            body.innerHTML = `
                ${posterHtml}
                <div class="info-grid">
                    ${infoItems.map(item => `
                        <div class="info-item">
                            <div class="info-label">${item.label}</div>
                            <div class="info-value">${escapeHtml(item.value)}</div>
                        </div>
                    `).join('')}
                </div>
                ${plotHtml}
                <div class="info-item" style="margin-top: 16px;">
                    <div class="info-label">File Path</div>
                    <div class="info-value" style="word-break: break-all; font-size: 0.85em;">${escapeHtml(movie.full_path)}</div>
                </div>
            `;

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal(event) {
            if (event && event.target !== event.currentTarget) return;
            const modal = document.getElementById('modalOverlay');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        // Close modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
                closeSearchModal();
            }
        });

        async function playMovie(uuid) {
            try {
                const response = await fetch(`/play?id=${uuid}`);
                const result = await response.json();
                if (result.status === 'success') {
                    console.log(result.message);
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (error) {
                console.error('Play error:', error);
                alert('Failed to send play request');
            }
        }

        // ============================================
        // Manual OMDb Search Functions
        // ============================================

        function openSearchModal(uuid, extractedName, extractedYear) {
            const modal = document.getElementById('searchModalOverlay');

            // Set values
            document.getElementById('searchMovieUuid').value = uuid;
            document.getElementById('searchImdbId').value = '';
            document.getElementById('searchTitle').value = extractedName || '';
            document.getElementById('searchYear').value = extractedYear || '';
            document.getElementById('searchResult').innerHTML = '';

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';

            // Focus the IMDb ID field
            setTimeout(() => {
                document.getElementById('searchImdbId').focus();
            }, 100);
        }

        function closeSearchModal(event) {
            if (event && event.target !== event.currentTarget) return;
            const modal = document.getElementById('searchModalOverlay');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        async function submitManualSearch() {
            const uuid = document.getElementById('searchMovieUuid').value;
            const imdbId = document.getElementById('searchImdbId').value.trim();
            const title = document.getElementById('searchTitle').value.trim();
            const year = document.getElementById('searchYear').value.trim();
            const resultDiv = document.getElementById('searchResult');

            // Validate
            if (!imdbId && !title) {
                resultDiv.innerHTML = '<div class="search-result error">Please enter an IMDb ID or movie title.</div>';
                return;
            }

            // Show loading
            resultDiv.innerHTML = '<div class="search-result" style="color: var(--text-secondary);">🔍 Searching OMDb...</div>';

            try {
                const response = await fetch('/api/manual-enrich', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        uuid: uuid,
                        imdb_id: imdbId,
                        title: title,
                        year: year
                    })
                });

                const result = await response.json();

                if (result.status === 'success') {
                    resultDiv.innerHTML = `<div class="search-result success">✅ ${result.message}</div>`;

                    // Reload movies after 1.5 seconds
                    setTimeout(() => {
                        closeSearchModal();
                        loadMovies();
                    }, 1500);
                } else {
                    resultDiv.innerHTML = `<div class="search-result error">❌ ${result.message}</div>`;
                }
            } catch (error) {
                console.error('Search error:', error);
                resultDiv.innerHTML = '<div class="search-result error">❌ Failed to connect to server.</div>';
            }
        }

        // Initial load
        loadMovies();
    </script>

</body>

</html>
