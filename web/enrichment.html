<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enrichment Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0f;
            --text-primary: #f0f0f5;
            --text-secondary: #a0a0b0;
            --accent: #bb86fc;
            --border: rgba(187, 134, 252, 0.15);
            --card-bg: rgba(30, 30, 46, 0.8);
            --success: #4caf50;
            --info: #2196f3;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            margin: 0;
            color: var(--accent);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .movie-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .movie-row {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .movie-info {
            flex: 1;
            min-width: 300px;
        }

        .file-name {
            font-size: 0.85em;
            color: var(--text-secondary);
            margin-bottom: 5px;
            font-family: monospace;
        }

        .movie-title {
            font-weight: 600;
            font-size: 1.1em;
        }

        .inputs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 6px;
            font-family: inherit;
        }

        input.imdb-input {
            width: 120px;
        }

        input.year-input {
            width: 80px;
        }

        input.title-input {
            width: 200px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        button {
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-update {
            background: var(--info);
            color: white;
        }

        .btn-info {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            background: rgba(255, 255, 255, 0.1);
        }

        .enriched {
            color: var(--success);
        }

        .pending {
            color: var(--text-secondary);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid var(--border);
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Enrichment Manager</h1>
            <a href="/" style="color: var(--text-secondary); text-decoration: none;">Back to Viewer</a>
        </header>

        <div class="tabs" role="tablist">
            <button class="tab-btn active" role="tab" aria-selected="true" onclick="switchTab('pending')">Pending Enrichment</button>
            <button class="tab-btn" role="tab" aria-selected="false" onclick="switchTab('enriched')">Enriched</button>
        </div>

        <div id="movieList" class="movie-list">
            <div style="text-align: center; color: var(--text-secondary);">Loading...</div>
        </div>
    </div>

    <!-- Info Modal -->
    <div id="infoModal" class="modal-overlay" onclick="closeModal()">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" onclick="event.stopPropagation()">
            <h2 id="modalTitle">Movie Details</h2>
            <div id="modalContent"></div>
            <button onclick="closeModal()" style="margin-top: 20px; width: 100%;">Close</button>
        </div>
    </div>

    <script>
        let allMovies = [];
        let currentTab = 'pending';

        // Escape untrusted strings before inserting into HTML. All movie
        // fields originate from filenames on disk, the OMDb API, or user
        // input, so they must never be trusted in innerHTML/attributes.
        // Escapes the quote characters too, so the result is safe inside
        // double/single-quoted attributes (e.g. value="...") as well as
        // element text.
        const _HTML_ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            return String(text).replace(/[&<>"']/g, c => _HTML_ESCAPES[c]);
        }

        // Only allow absolute http(s) poster URLs (what OMDb returns); reject
        // anything else (a javascript:/data: scheme, or an attribute-breakout
        // payload, which is not an absolute URL). Parsing without a base means
        // relative/garbage values throw and are rejected.
        function safePosterUrl(url) {
            if (!url || url === 'NA') return null;
            try {
                const u = new URL(url);
                return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : null;
            } catch (e) {
                return null;
            }
        }

        async function init() {
            const container = document.getElementById('movieList');
            try {
                const res = await fetch('/api/movies');
                if (!res.ok) throw new Error(res.statusText || ('HTTP ' + res.status));
                allMovies = await res.json();
                render();
            } catch (e) {
                console.error(e);
                // Previously left a permanent "Loading..." on failure.
                container.innerHTML = `<div style="text-align:center; padding:40px; color:#ff6b6b;">❌ Failed to load movies (${escapeHtml(e.message)}). Is the server running?</div>`;
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => {
                const isActive = b.getAttribute('onclick').includes(`'${tab}'`);
                b.classList.toggle('active', isActive);
                b.setAttribute('aria-selected', isActive ? 'true' : 'false');
            });
            render();
        }

        function render() {
            const container = document.getElementById('movieList');
            container.innerHTML = '';

            const filtered = allMovies.filter(m => {
                const isEnriched = m.title !== 'NA' && m.title != null;
                return currentTab === 'enriched' ? isEnriched : !isEnriched;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 40px;">No movies found in this category.</div>`;
                return;
            }

            filtered.forEach(movie => {
                const row = document.createElement('div');
                row.className = 'movie-row';

                const displayTitle = movie.ai_title !== 'NA' ? movie.ai_title : movie.extracted_name;
                const displayYear = movie.ai_year !== 'NA' ? movie.ai_year : movie.extracted_year;

                const titleVal = escapeHtml(displayTitle !== 'NA' ? displayTitle : '');
                const yearVal = escapeHtml(displayYear !== 'NA' ? displayYear : '');
                const imdbVal = escapeHtml(movie.imdb_id !== 'NA' ? movie.imdb_id : '');
                const rateVal = escapeHtml(movie.user_rating !== 'NA' && movie.user_rating ? movie.user_rating : '');
                const tagsVal = escapeHtml(movie.user_tags !== 'NA' && movie.user_tags ? movie.user_tags : '');
                const uuid = escapeHtml(movie.uuid);

                row.innerHTML = `
                    <div class="movie-info">
                        <div class="file-name">${escapeHtml(movie.file_name)}</div>
                        <div class="movie-title">${escapeHtml(displayTitle)} (${escapeHtml(displayYear)})</div>
                    </div>

                    <div class="inputs">
                        <input type="text" class="title-input" placeholder="Title" value="${titleVal}" id="title-${uuid}">
                        <input type="text" class="year-input" placeholder="Year" value="${yearVal}" id="year-${uuid}">
                        <input type="text" class="imdb-input" placeholder="IMDb ID" value="${imdbVal}" id="imdb-${uuid}">
                        <input type="number" class="year-input" placeholder="Rate" min="0" max="10" value="${rateVal}" id="rate-${uuid}" title="User Rating (0-10)">
                        <input type="text" class="imdb-input" placeholder="Tags" value="${tagsVal}" id="tags-${uuid}" title="Comma-separated tags">
                    </div>

                    <div class="actions">
                        ${currentTab === 'enriched' ?
                        `<button class="btn-info" onclick="showInfo('${uuid}')">Info</button>` : ''}
                        <button class="btn-update" onclick="updateMovie('${uuid}', event)">
                            ${currentTab === 'enriched' ? 'Update' : 'Enrich'}
                        </button>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        async function updateMovie(uuid, e) {
            const title = document.getElementById(`title-${uuid}`).value;
            const year = document.getElementById(`year-${uuid}`).value;
            const imdbId = document.getElementById(`imdb-${uuid}`).value;
            const rating = document.getElementById(`rate-${uuid}`).value;
            const tags = document.getElementById(`tags-${uuid}`).value;

            // Show loading state. Use currentTarget so we always get the
            // button element, even if a child node was the click target.
            const btn = e.currentTarget;
            const originalText = btn.textContent;
            btn.textContent = '...';
            btn.disabled = true;

            const postJson = async (url, body) => {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                if (!res.ok) throw new Error(res.statusText || ('HTTP ' + res.status));
                const data = await res.json();
                if (data.status === 'error') throw new Error(data.message);
                return data;
            };

            try {
                // 1. Update Metadata (Rating/Tags)
                if (rating || tags) {
                    await postJson('/api/update-metadata', { uuid, user_rating: rating, user_tags: tags });
                }

                // 2. Enrichment
                if (title || imdbId) {
                    await postJson('/api/manual-enrich', { uuid, title, year, imdb_id: imdbId });
                }

                // Refresh only on success
                await init();

            } catch (error) {
                console.error('Update failed:', error);
                alert('Update failed: ' + error.message);
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        function showInfo(uuid) {
            const movie = allMovies.find(m => m.uuid === uuid);
            if (!movie) return;

            const content = document.getElementById('modalContent');
            const poster = safePosterUrl(movie.poster);
            content.innerHTML = `
                <div style="display:flex; gap:20px; align-items:start;">
                    ${poster ? `<img src="${escapeHtml(poster)}" alt="${escapeHtml(movie.title)} poster" style="width:150px; border-radius:8px;">` : ''}
                    <div>
                        <h3>${escapeHtml(movie.title)} (${escapeHtml(movie.year)})</h3>
                        <p><strong>Genre:</strong> ${escapeHtml(movie.genre)}</p>
                        <p><strong>Director:</strong> ${escapeHtml(movie.director)}</p>
                        <p><strong>Actors:</strong> ${escapeHtml(movie.actors)}</p>
                        <p><strong>Plot:</strong> ${escapeHtml(movie.plot)}</p>
                        <p><strong>IMDb:</strong> ${escapeHtml(movie.imdb_rating)} (${escapeHtml(movie.imdb_id)})</p>
                    </div>
                </div>
            `;
            _modalReturnFocus = document.activeElement;
            const modal = document.getElementById('infoModal');
            modal.style.display = 'flex';
            // Move focus into the dialog (the Close button).
            const closeBtn = modal.querySelector('.modal button');
            if (closeBtn) closeBtn.focus();
        }

        let _modalReturnFocus = null;
        function closeModal() {
            document.getElementById('infoModal').style.display = 'none';
            if (_modalReturnFocus && _modalReturnFocus.focus) _modalReturnFocus.focus();
            _modalReturnFocus = null;
        }

        // Close the info modal on Escape.
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.getElementById('infoModal').style.display === 'flex') {
                closeModal();
            }
        });

        init();
    </script>
</body>

</html>
